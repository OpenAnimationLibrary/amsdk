name: Animation Master Windows Build

on:
  pull_request:
    paths: ['tools/am-cloud/**', '.github/workflows/am-plugin-windows.yml']
  push:
    branches: [main]
    paths: ['tools/am-cloud/**', '.github/workflows/am-plugin-windows.yml']
  workflow_dispatch:
    inputs:
      configuration:
        description: Release for ordinary A:M; Debug requires the matching debug host
        type: choice
        options: [Release, Debug]
        default: Release
      project:
        description: Repository-relative plugin project path
        type: string
        default: tools/am-cloud/plugins/AMBuildSmoke/AMBuildSmoke.vcxproj

permissions:
  contents: read

concurrency:
  group: am-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      AM_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      AM_PROJECT: ${{ inputs.project || 'tools/am-cloud/plugins/AMBuildSmoke/AMBuildSmoke.vcxproj' }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test build helper
        run: python -m unittest discover -s tools/am-cloud/tests -v
      - name: Compile and audit plugin
        id: compile
        shell: pwsh
        run: python tools/am-cloud/build.py --configuration "$env:AM_CONFIGURATION" --project "$env:AM_PROJECT"
      - name: Diagnose SDK download after a build failure
        if: failure() && steps.compile.conclusion == 'failure'
        run: python tools/am-cloud/diagnose_sdk.py
      - name: Preserve diagnostics and successful build outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AMBuild-${{ env.AM_CONFIGURATION }}-x64-${{ github.run_number }}
          path: tools/am-cloud/artifacts/
          if-no-files-found: warn
          retention-days: 7
